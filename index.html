<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#e38b12" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Golden Wok | Online Order</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Inter:wght@420;560;700&display=swap" rel="stylesheet" />
<style>
  :root { --orange:#e38b12; --ink:#222; --line:#e5e5e5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter, system-ui, sans-serif; background:#e8e8e8; color:var(--ink); }
  button, input, select, textarea { font:inherit; }
  a { color:inherit; }
  .phone { width:min(440px,100%); margin:0 auto; background:#fff; min-height:100vh; }
  .top { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; z-index:6; }
  .logo { width:46px; height:46px; border-radius:50%; background:#e10600; color:#fff; display:grid; place-items:center; font-weight:700; }
  .word { font-weight:700; letter-spacing:.12em; font-size:15px; }
  .word span { display:block; letter-spacing:.2em; font-size:12px; }
  .menu-btn { margin-left:auto; border:0; background:transparent; cursor:pointer; font-weight:700; }
  .hero { height:68vh; background:#1a120e center/cover no-repeat; display:grid; place-items:center; text-align:center; color:#fff; position:relative; }
  .hero:after { content:""; position:absolute; inset:0; background:rgba(0,0,0,.48); }
  .hero .in { position:relative; z-index:1; }
  .hero h1 { font-family:"Libre Baskerville", serif; font-size:36px; margin:0 0 14px; }
  .order-btn { background:var(--orange); color:#fff; border:0; border-radius:6px; padding:14px 28px; font-size:18px; font-weight:700; cursor:pointer; }
  .bar { position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:center; padding:12px 48px; border-bottom:1px solid var(--line); background:#fff; text-align:center; }
  .bar b { font-size:15px; line-height:1.25; }
  .back, .cart { position:absolute; border:0; background:transparent; cursor:pointer; font-size:20px; }
  .back { left:8px; }
  .cart { right:12px; }
  .cats { display:flex; gap:8px; overflow:auto; padding:10px 12px; background:#f7f7f7; border-bottom:1px solid var(--line); position:sticky; top:48px; z-index:4; }
  .cats button { border:0; background:#fff; border-radius:999px; padding:8px 12px; white-space:nowrap; cursor:pointer; font-weight:650; }
  .cats button.on { background:#111; color:#fff; }
  .cat { background:#f7f7f7; padding:14px; border-bottom:1px solid var(--line); }
  .cat h2 { margin:0; font-size:15px; letter-spacing:.04em; }
  .cat p { margin:6px 0 0; color:#777; font-size:13px; }
  .item { display:flex; gap:10px; width:100%; text-align:left; padding:13px 14px; border:0; border-bottom:1px solid var(--line); background:#fff; cursor:pointer; }
  .item .name { flex:1; font-size:15px; }
  .zh { color:#888; display:block; font-size:13px; }
  .price { white-space:nowrap; }
  h3.mod { margin:18px 14px 8px; font-size:17px; }
  .opt { display:grid; grid-template-columns:72px 1fr; align-items:center; border:1px solid #ddd; min-height:62px; padding:8px 16px; margin:0 0 8px; }
  .opt input { justify-self:center; width:20px; height:20px; accent-color:#1a73e8; }
  .opt span { text-align:right; line-height:1.25; }
  .opt small { display:block; }
  .sticky { position:sticky; bottom:0; background:var(--orange); color:#fff; display:flex; }
  .sticky .amt { padding:14px 16px; font-size:20px; font-weight:700; border-right:1px solid rgba(255,255,255,.35); min-width:108px; }
  .sticky button { flex:1; border:0; background:transparent; color:#fff; font-size:18px; font-weight:700; cursor:pointer; }
  .sticky button:disabled { opacity:.55; }
  .line { padding:14px; border-bottom:1px solid var(--line); }
  .mods { color:#666; font-size:13px; }
  .sum { padding:8px 14px 110px; }
  .sum div, .mods div { display:flex; justify-content:space-between; padding:4px 0; }
  .min { background:#f3f3f3; text-align:center; padding:10px; margin:8px 0; font-weight:700; }
  .hide { display:none; }
  input, textarea, select { width:100%; border:1px solid #ddd; border-radius:6px; padding:11px; margin-top:6px; }
  .box { padding:14px 14px 110px; }
  .fire { color:#e10600; }
</style>
</head>
<body>
<div class="phone">
  <section id="home">
    <div class="top">
      <div class="logo" id="mark">林</div>
      <div class="word" id="word">GOLDEN<span>WOK</span></div>
      <button class="menu-btn" onclick="show('brand')">Rebrand</button>
    </div>
    <div class="hero" style="background-image:url('img/spread.jpg')">
      <div class="in">
        <h1 id="heroName">Golden Wok</h1>
        <p id="heroSub">Free delivery at $15</p>
        <button class="order-btn" onclick="show('menu')">Online Order</button>
        <p><button class="order-btn" style="background:#111;margin-top:10px" onclick="installApp()">Add to phone</button></p>
      </div>
    </div>
  </section>
  <section id="menu" class="hide">
    <div class="bar">
      <button class="back" onclick="show('home')">←</button>
      <b id="menuName">GOLDEN WOK</b>
      <button class="cart" onclick="openCart()">🛒 <span id="count">0</span></button>
    </div>
    <div class="cats" id="chips"></div>
    <div id="list"></div>
  </section>
  <section id="detail" class="hide">
    <div class="bar"><button class="back" onclick="show('menu')">←</button><b id="dTitle">Item</b></div>
    <div id="mods" style="padding-bottom:90px"></div>
    <div class="sticky"><div class="amt" id="dPrice">$0</div><button onclick="addCurrent()">Add to cart</button></div>
  </section>
  <section id="cart" class="hide">
    <div class="bar"><button class="back" onclick="show('menu')">←</button><b>SHOPPING CART</b></div>
    <div id="cartLines"></div>
    <div class="sum" id="sum"></div>
    <div class="sticky"><div class="amt" id="cartTotal">TOTAL<br>$0</div><button id="goPay" onclick="show('pay')">Go to Checkout</button></div>
  </section>
  <section id="pay" class="hide">
    <div class="bar"><button class="back" onclick="openCart()">←</button><b>CHECKOUT</b></div>
    <div class="box">
      <input id="cname" placeholder="Name on the bag" />
      <input id="cphone" placeholder="Phone" />
      <label><input type="radio" name="mode" checked onchange="mode='delivery'"> Delivery · free at $15</label>
      <label><input type="radio" name="mode" onchange="mode='pickup'"> Pickup</label>
      <input id="addr" placeholder="Street" />
      <label><input type="radio" name="pay" checked onchange="pay='card'"> Card</label>
      <label><input type="radio" name="pay" onchange="pay='cash'"> Cash</label>
      <input id="card" placeholder="4242 4242 4242 4242" />
      <input id="exp" placeholder="MM/YY" />
      <textarea id="note" rows="2" placeholder="No onion, extra sauce, spice"></textarea>
      <p id="eta"></p>
      <button class="order-btn" style="width:100%" onclick="place()">Pay and send</button>
      <p id="done"></p>
    </div>
  </section>
  <section id="track" class="hide">
    <div class="bar"><button class="back" onclick="show('home')">←</button><b>YOUR ORDER</b></div>
    <div class="box" id="trackBox"></div>
  </section>
  <section id="brand" class="hide">
    <div class="bar"><button class="back" onclick="show('home')">←</button><b>REBRAND</b></div>
    <div class="box">
      <p>Paste the Yelp name, street, and phone.</p>
      <input id="fName" placeholder="Restaurant name" />
      <input id="fTown" placeholder="Town" />
      <input id="fStreet" placeholder="Street" />
      <input id="fPhone" placeholder="Phone" />
      <button class="order-btn" onclick="saveBrand()">Apply</button>
    </div>
  </section>
</div>
<script>

    ["Hunan Beef","湖南牛",16.95,1],["Szechuan Beef","四川牛",16.95,1]
  ]},
  { id:"pork", title:"PORK", blurb:"Roast pork unless it says spare rib.", items:[
    ["Roast Pork with Broccoli","芥兰叉烧",15.50],["Roast Pork with Garlic Sauce","鱼香叉烧",15.95,1],
    ["Roast Pork with Mixed Vegetables","杂菜叉烧",15.50],["Sweet & Sour Pork","甜酸肉",15.50],
    ["Twice Cooked Pork","回锅肉",16.50,1],["BBQ Spare Ribs Dinner","排骨晚餐",17.95]
  ]},
  { id:"sea", title:"SEAFOOD", blurb:"Shrimp is the default. Lobster sauce is not lobster.", items:[
    ["Shrimp with Broccoli","芥兰虾",17.25],["Shrimp with Lobster Sauce","虾龙糊",17.95],
    ["Shrimp with Garlic Sauce","鱼香虾",17.95,1],["Kung Pao Shrimp","宫保虾",17.95,1],
    ["Shrimp with Mixed Vegetables","杂菜虾",17.25],["Happy Family","全家福",19.95],
    ["Seafood Delight","海鲜大会",20.95],["General Tso's Shrimp","左宗虾",18.50]
  ]},
  { id:"veg", title:"VEGETABLE & TOFU", blurb:"For the one person in the car who doesn't eat meat.", items:[

    ["Bean Curd with Mixed Vegetables","杂菜豆腐",13.50],["Ma Po Tofu","麻婆豆腐",13.95,1],
    ["General Tso's Tofu","左宗豆腐",13.95],["Buddha's Delight","罗汉斋",13.50],

    ["Extra Hot Sauce","辣酱",0.75],["Can of Soda","汽水",1.75],["Fortune Cookies (4)","签语饼",1.00]
  ]}

const DEFAULTS = { name:"Golden Wok", town:"West Islip", street:"100 Main Street", phone:"(555) 014-0188" };
let shop = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem("gw-shop")||"{}"));
let cart = JSON.parse(localStorage.getItem("gw-cart")||"[]");
let current = null, mode = "delivery", pay = "card";
function money(n){ return "$"+Number(n).toFixed(2); }
function paint(){
  const bits = shop.name.toUpperCase().split(" ");
  document.getElementById("word").innerHTML = (bits[0]||"WOK")+"<span>"+(bits.slice(1).join(" ")||"HOUSE")+"</span>";
  document.getElementById("mark").textContent = shop.name.slice(0,1);
  document.getElementById("heroName").textContent = shop.name;
  document.getElementById("heroSub").textContent = shop.town+" · "+shop.phone+" · free delivery at $15";
  document.getElementById("menuName").textContent = shop.name.toUpperCase();
  document.title = shop.name+" | Online Order";
}
function show(id){
  ["home","menu","detail","cart","pay","brand","track"].forEach(s=>document.getElementById(s).classList.toggle("hide", s!==id));
  if (id==="menu") renderList();
  if (id==="pay") document.getElementById("eta").textContent = eta();
  if (id==="brand"){ document.getElementById("fName").value=shop.name; document.getElementById("fTown").value=shop.town; document.getElementById("fStreet").value=shop.street; document.getElementById("fPhone").value=shop.phone; }
}
function findItem(id){
  for (const c of MENU) for (const it of c.items) if (c.id+"-"+it[0]===id) return { cat:c, it };
}
function renderList(){
  document.getElementById("chips").innerHTML = MENU.map((c,i)=>`<button type="button" class="${i===0?"on":""}" data-go="${c.id}">${c.title.split(" ")[0]}</button>`).join("");
  document.getElementById("list").innerHTML = MENU.map(c=>`<div class="cat" id="${c.id}"><h2>${c.title}</h2><p>${c.blurb}</p></div>`+c.items.map((it,n)=>`<button type="button" class="item" data-cat="${c.id}" data-i="${n}"><div class="name">${it[0]}${it[3]?" <span class='fire'>🔥</span>":""}<span class="zh">${it[1]}</span></div><div class="price">${it[2].toFixed(2)}</div></button>`).join("")).join("");
  document.getElementById("count").textContent = cart.reduce((s,i)=>s+i.qty,0);
}
document.getElementById("list").addEventListener("click", e => {
  const btn = e.target.closest(".item");
  if (!btn) return;
  openItem(btn.dataset.cat, Number(btn.dataset.i));
});
document.getElementById("chips").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  go(btn.dataset.go, btn);
});
function go(id, btn){ document.querySelectorAll(".cats button").forEach(b=>b.classList.remove("on")); btn.classList.add("on"); document.getElementById(id).scrollIntoView({behavior:"smooth", block:"start"}); }
function optionRow(group, label, zh, checked){
  const safe = String(label).replace(/'/g, "");
  return `<label class="opt"><input type="radio" name="${group}" ${checked?"checked":""} onchange="current.${group}='${safe}'"><span>${label}<small>${zh||""}</small></span></label>`;
}
function rows(group, title, choices){
  return `<h3 class="mod">${title}</h3>`+choices.map((c,n)=>optionRow(group, c[0], c[1]||"", n===0)).join("");
}
function openItem(catId, index){
  const cat = MENU.find(c=>c.id===catId);
  const it = cat.items[index];
  if (!it) return;
  current = { cat:cat.id, name:it[0], zh:it[1], price:it[2], soup:"", rice:"", spice:"", size:"", sauce:"", gravy:"" };
  document.getElementById("dTitle").textContent = (it[0]+" "+it[1]).toUpperCase();
  document.getElementById("dPrice").textContent = money(it[2]);
  let html = "";
  if (cat.id==="dinner" || cat.id==="lunch"){
    current.soup = "Wonton Soup";
    current.rice = "White Rice";
    html += rows("soup", "Soup, Egg Roll or Soda (Required)", SOUPS);
    html += rows("rice", "Rice Choice (Required)", RICES);
  }
  if (cat.id==="apps"){
    current.sauce = "Duck sauce";
    if (/wing/i.test(it[0])) html += rows("sauce", "Wing style", [["Salt and pepper",""],["Hot",""],["BBQ",""],["Plain",""]]);
    else if (/rib/i.test(it[0])) html += rows("sauce", "Rib sauce", [["House BBQ",""],["Duck sauce",""],["Hot mustard",""],["Dry",""]]);
    else html += rows("sauce", "Sauce on the side", [["Duck sauce",""],["Hot mustard",""],["Duck and mustard",""],["Sweet chili",""],["None",""]]);
  }
  if (cat.id==="soup"){
    current.size = /quart/i.test(it[0]) ? "Quart" : "Pint";
    if (!/quart/i.test(it[0])) html += rows("size", "Size", [["Pint",""],["Quart","+$3.25"]]);
    if (/hot/i.test(it[0])) html += rows("spice", "Heat", [["Mild",""],["Medium",""],["Hot",""]]);
  }
  if (cat.id==="rice" || cat.id==="mein" || cat.id==="chow"){
    current.size = /quart/i.test(it[0]) ? "Quart" : "Pint";
    if (!/quart/i.test(it[0])) html += rows("size", "Size", [["Pint",""],["Quart","+$4"]]);
    html += rows("sauce", "On the side", [["No extra sauce",""],["Duck sauce",""],["Hot sauce",""],["Gravy",""]]);
  }
  if (cat.id==="foo"){
    current.gravy = "Gravy on the side";
    html += rows("gravy", "Gravy", [["Gravy on the side",""],["Gravy on top",""],["No gravy",""]]);
  }
  if (cat.id==="poultry" || cat.id==="beef" || cat.id==="pork" || cat.id==="sea" || cat.id==="veg"){
    current.spice = "Mild";
    current.rice = "White Rice";
    current.sauce = "Sauce on the dish";
    html += rows("spice", "Spice", [["Mild",""],["Medium",""],["Hot",""]]);
    html += rows("rice", "Rice", RICES.concat([["No rice",""]]));
    html += rows("sauce", "Sauce", [["Sauce on the dish",""],["Sauce on the side",""],["Extra sauce",""],["Light sauce",""]]);
  }
  if (cat.id==="side" && /soda/i.test(it[0])){
    current.sauce = "Coke";
    html += rows("sauce", "Soda", [["Coke",""],["Diet Coke",""],["Sprite",""],["Ginger ale",""]]);
  }
  document.getElementById("mods").innerHTML = html || "<p style='padding:14px;color:#777'>No choice on this one. Add it.</p>";
  show("detail");
}
function addCurrent(){
  let price = current.price;
  if (current.size==="Quart" && !/quart/i.test(current.name)) price += current.cat==="soup" ? 3.25 : 4;
  const bits = [current.soup, current.rice, current.spice, current.size, current.sauce, current.gravy].filter(Boolean);
  cart.push({ name:current.name, zh:current.zh, price, qty:1, soup:bits.join(" · "), rice:"", spice:"", cat:current.cat });
  localStorage.setItem("gw-cart", JSON.stringify(cart));
  openCart();
}
function openCart(){
  document.getElementById("cartLines").innerHTML = cart.map((l,idx)=>`<div class="line"><b>${l.qty}x ${l.name} ${l.zh}</b> ${l.price.toFixed(2)} <button onclick="cart.splice(${idx},1);localStorage.setItem('gw-cart',JSON.stringify(cart));openCart()">×</button><div class="mods">${l.soup?`<div><span>${l.soup}</span></div>`:""}${l.rice?`<div><span>${l.rice}</span></div>`:""}${l.spice?`<div><span>Spice: ${l.spice}</span></div>`:""}</div></div>`).join("") || "<p style='padding:14px'>Cart is empty.</p>";
  const sub = cart.reduce((s,l)=>s+l.price*l.qty,0), tax = sub*TAX;
  document.getElementById("sum").innerHTML = `<div class="min">Minimum order $15.00 · delivery free at $15</div><div><span>Sub-Total</span><span>${money(sub)}</span></div><div><span>Sales tax (8.625%)</span><span>${money(tax)}</span></div><div><span>Delivery</span><span>${mode==="delivery"?"Free":"—"}</span></div><div><b>Total</b><b>${money(sub+tax)}</b></div>`;
  document.getElementById("cartTotal").innerHTML = "TOTAL<br>"+money(sub+tax);
  document.getElementById("goPay").disabled = sub < MIN;
  document.getElementById("goPay").textContent = sub < MIN ? "Need $15" : "Go to Checkout";
  show("cart");
}
function eta(){
  const qty = cart.reduce((s,i)=>s+i.qty,0);
  const rush = (new Date().getHours()>=17 && new Date().getHours()<=20) ? 12 : 0;
  const lo = (mode==="delivery"?32:18)+rush+Math.max(0, qty-4)*2;
  return (mode==="delivery"?"Delivery ":"Pickup ")+lo+"–"+(lo+12)+" min";
}
function luhn(num){ const s=(num||"").replace(/\D/g,""); if(s.length<13) return false; let sum=0, alt=false; for(let i=s.length-1;i>=0;i--){ let n=+s[i]; if(alt){ n*=2; if(n>9)n-=9; } sum+=n; alt=!alt; } return sum%10===0; }
const BOARD = "dqp98n0e";
function kvPut(key, val){ return fetch("https://keyvalue.immanuel.co/api/KeyVal/UpdateValue/"+BOARD+"/"+key+"/"+encodeURIComponent(val), { method:"POST" }); }
function kvGet(key){ return fetch("https://keyvalue.immanuel.co/api/KeyVal/GetValue/"+BOARD+"/"+key).then(r=>r.json()).catch(()=>""); }
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; });
function installApp(){
  if (deferredPrompt) { deferredPrompt.prompt(); return; }
  alert("On iPhone: Share, Add to Home Screen. On Android: browser menu, Install app.");
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
async function saveTicket(ticket){
  await kvPut("t-"+ticket.id, JSON.stringify(ticket));
  const raw = await kvGet("ids");
  const ids = String(raw||"").split(",").filter(Boolean).filter(x=>x!==ticket.id);
  ids.unshift(ticket.id);
  await kvPut("ids", ids.slice(0, 25).join(","));
}
async function place(){
  const sub = cart.reduce((s,l)=>s+l.price*l.qty,0);
  if (sub<MIN) return alert("No checkout under $15.");
  const name = document.getElementById("cname").value.trim();
  const phone = document.getElementById("cphone").value.trim();
  const addr = document.getElementById("addr").value.trim();
  if (!name || phone.length<7) return alert("Name and phone.");
  if (mode==="delivery" && addr.length<6) return alert("Need a street.");
  const ticket = { id:"GW-"+Math.floor(1000+Math.random()*9000), at:new Date().toLocaleTimeString(), ts:Date.now(), status:"new", shop:shop.name, mode, eta:eta(), pay, note:document.getElementById("note").value.trim().slice(0,80), items:cart.map(i=>({n:i.name,q:i.qty,s:i.soup||"",r:i.rice||""})), sub, total:Math.round((sub+sub*TAX)*100)/100, name, phone, addr: mode==="delivery"?addr:"PICKUP", paid:false, payLabel: pay==="card"?"CARD PENDING":"CASH COLLECT" };
  if (pay==="card"){
    const res = await fetch("/api/orders", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ ticket }) });
    const data = await res.json().catch(()=>({}));
    if (data.checkoutUrl) { location.href = data.checkoutUrl; return; }
    return alert(data.error || "Card processor is not connected. Cash works. I will not fake a charge.");
  }
  await saveTicket(ticket);
  cart = []; localStorage.setItem("gw-cart","[]");
  watch(ticket.id);
}
async function watch(id){
  show("track");
  const raw = await kvGet("t-"+id);
  const t = typeof raw==="string" ? JSON.parse(raw||"{}") : raw;
  const label = { new:"Kitchen has it", wok:"On the wok", ready:"Ready", done:"Done" }[t.status] || "Sent";
  document.getElementById("trackBox").innerHTML = `<h2>${t.id||id}</h2><p>${label}</p><p>${t.eta||""}</p><p>${t.payLabel||""}</p><p>${t.addr||""}</p><p>${(t.items||[]).map(i=>i.q+" × "+i.n).join("<br>")}</p><p><b>$${Number(t.total||0).toFixed(2)}</b></p>`;
  if (t.status!=="done") setTimeout(()=>watch(id), 5000);
}
function saveBrand(){
  shop.name = document.getElementById("fName").value||DEFAULTS.name;
  shop.town = document.getElementById("fTown").value||DEFAULTS.town;
  shop.street = document.getElementById("fStreet").value||DEFAULTS.street;
  shop.phone = document.getElementById("fPhone").value||DEFAULTS.phone;
  localStorage.setItem("gw-shop", JSON.stringify(shop));
  paint(); show("home");
}
paint();
</script>
